services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: employee-management-api:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"

  mongodb:
    image: mongo:7
    profiles: ["local"]
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

volumes:
  mongo_data:
